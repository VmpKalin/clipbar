name: ClipBar
options:
  bundleIdPrefix: com.aholoiad
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipBar:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/Core
      - path: Sources/App
        excludes: ["Resources/Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholoiad.clipbar
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/ClipBar.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/App/Resources/ClipBar-macOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
    dependencies:
      - target: ClipBarWidget
        platformFilter: iOS
        embed: true
  ClipBarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Core
      - path: Sources/Widget
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholoiad.clipbar.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/ClipBarWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: ClipBar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ClipBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholoiad.clipbar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  ClipBar:
    build:
      targets:
        ClipBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClipBarTests]
  ClipBarTests:
    build:
      targets:
        ClipBarTests: all
    test:
      config: Debug
      targets: [ClipBarTests]
