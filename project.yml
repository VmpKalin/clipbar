name: ClipBar
options:
  bundleIdPrefix: com.aholoiad
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  ClipBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/App
        excludes: ["Resources/Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholoiad.clipbar
        INFOPLIST_FILE: Sources/App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Resources/ClipBar.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 33K57T9459
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ClipBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aholoiad.clipbar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  ClipBar:
    build:
      targets:
        ClipBar: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [ClipBarTests]
  ClipBarTests:
    build:
      targets:
        ClipBarTests: all
    test:
      config: Debug
      targets: [ClipBarTests]
